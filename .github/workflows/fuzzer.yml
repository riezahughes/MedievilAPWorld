name: Fuzz APWorld

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: Eijebong/ap-actions/fuzz@main
        with:
          apworld-path: worlds/medievil
          ap-version: '0.6.7'
          python-version: '3.12'
          runs: 100
